name: my_compose_aio

services:
  docker_aio_compose:
    image: 0xee/my_docker_aio:latest
    container_name: my_docker_aio
    ports:
      - "40080:80"
      - "40081:5432"
    volumes:
      - ./nginx:/etc/nginx
      - ./html:/var/www/html
      - ./postgresql:/etc/postgresql/16/main
      - ./php:/etc/php/8.3
      - ./supervisor:/etc/supervisor
      - ./crontab:/etc/cron.d
      - ./start.sh:/myCompose/start.sh
      - ./init.sh:/myCompose/init.sh
    command: ["/bin/bash", "/myCompose/start.sh"]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: Pa55W0rd
